; One PlatformIO project for all the ESP32 test firmware. Each protocol lives in its own folder
; and builds as its own environment, so `pio run -e uart -t upload` flashes the UART test.

[platformio]
src_dir = .
default_envs = uart

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:uart]
build_src_filter = +<uart/>

; Add these once the folders have code in them:
; [env:spi]
; build_src_filter = +<spi/>
;
; [env:i2c]
; build_src_filter = +<i2c/>
